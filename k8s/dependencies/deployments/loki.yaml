apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.2
          ports:
            - containerPort: 3100
          args:
            - -config.file=/etc/loki/loki-config.yaml
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: loki-config-volume
              mountPath: /etc/loki
              readOnly: true
            - name: loki-storage
              mountPath: /tmp/loki
      volumes:
        - name: loki-config-volume
          configMap:
            name: loki-config
        - name: loki-storage
          persistentVolumeClaim:
            claimName: loki-pvc

