apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-config
  namespace: ${NAMESPACE}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: "0.0.0.0:4318"
          grpc:
            endpoint: "0.0.0.0:4317"

    processors:
      batch:

    exporters:
      prometheus:
        endpoint: "0.0.0.0:9090"
        send_timestamps: true
        metric_expiration: 180m
        enable_open_metrics: true
        add_metric_suffixes: true
        resource_to_telemetry_conversion:
          enabled: true
      debug: {}

    extensions:
      health_check:

    service:
      telemetry:
        logs:
          level: debug
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, prometheus]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]

