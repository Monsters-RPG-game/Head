apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ${NAMESPACE}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
      - static_configs:
        - targets:
    rule_files:
      # - "example-file.yaml"
    scrape_configs:
      - job_name: 'otelcollector'
        static_configs:
          - targets: ['otel:9090']
      - job_name: 'gateway_metrics'
        static_configs:
          - targets: ["monsters-gateway-service:5003"]
      - job_name: 'users_metrics'
        static_configs:
          - targets: ["monsters-users-service:80"]
      - job_name: 'messages_metrics'
        static_configs:
          - targets: ["monsters-messages-service:80"]
